# One-command local stack: MongoDB + the Doctor Tracker API.
#   docker compose up --build           # start db + api
#   docker compose run --rm seed        # seed admin + demo data (one-off)
#
# Host API port is configurable (macOS reserves 5000 for AirPlay):
#   API_PORT=4001 docker compose up --build
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ping:1}).ok']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/doctor_tracker
      JWT_SECRET: ${JWT_SECRET:-local_docker_dev_secret_change_me_please_0123456789}
      JWT_EXPIRES_IN: 1d
      JWT_REFRESH_EXPIRES_IN: 7d
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@doctortracker.com
      ADMIN_PASSWORD: Admin@1234
    ports:
      - '${API_PORT:-5000}:5000'

  # One-off seeder: `docker compose run --rm seed`
  seed:
    build: .
    profiles: ['seed']
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/doctor_tracker
      JWT_SECRET: ${JWT_SECRET:-local_docker_dev_secret_change_me_please_0123456789}
      ADMIN_NAME: Admin
      ADMIN_EMAIL: admin@doctortracker.com
      ADMIN_PASSWORD: Admin@1234
    command: ['node', 'dist/modules/seed/seed.cli.js']

volumes:
  mongo_data:
